<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="512"
  height="512"
  viewBox="0 0 512 512"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient
      id="srmGradient"
      x1="70"
      y1="55"
      x2="440"
      y2="455"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient
      id="goldGradient"
      x1="120"
      y1="110"
      x2="390"
      y2="400"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>

    <filter
      id="shadow"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="14"
        flood-opacity="0.18"
      />
    </filter>
  </defs>

  <!-- Outer portal shape -->
  <rect
    x="28"
    y="28"
    width="456"
    height="456"
    rx="112"
    fill="url(#srmGradient)"
    filter="url(#shadow)"
  />

  <!-- Inner panel -->
  <rect
    x="55"
    y="55"
    width="402"
    height="402"
    rx="88"
    fill="white"
    fill-opacity="0.08"
    stroke="white"
    stroke-opacity="0.2"
    stroke-width="2"
  />

  <!-- Graduation cap -->
  <path
    d="M256 104L104 174L256 244L408 174L256 104Z"
    fill="white"
  />

  <!-- Cap lower body -->
  <path
    d="M157 209V269C157 300 201 327 256 327C311 327 355 300 355 269V209L256 255L157 209Z"
    fill="white"
    fill-opacity="0.92"
  />

  <!-- Gold cap detail -->
  <path
    d="M408 174V255"
    stroke="url(#goldGradient)"
    stroke-width="10"
    stroke-linecap="round"
  />

  <circle
    cx="408"
    cy="268"
    r="15"
    fill="url(#goldGradient)"
  />

  <!-- Book -->
  <path
    d="M126 365C167 345 209 347 256 369V407C209 385 167 383 126 403V365Z"
    fill="white"
    fill-opacity="0.95"
  />

  <path
    d="M386 365C345 345 303 347 256 369V407C303 385 345 383 386 403V365Z"
    fill="white"
    fill-opacity="0.95"
  />

  <path
    d="M256 369V407"
    stroke="url(#goldGradient)"
    stroke-width="7"
    stroke-linecap="round"
  />

  <!-- Portal initials -->
  <text
    x="256"
    y="449"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    font-weight="700"
    letter-spacing="5"
    fill="white"
    fill-opacity="0.85"
  >
    SRM BBA
  </text>
</svg>
