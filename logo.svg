<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 256 256"
    width="256"
    height="256"
    role="img"
    aria-labelledby="title desc"
>

    <title id="title">
        SRM BBA Student Portal
    </title>

    <desc id="desc">
        SRM BBA academic portal logo
    </desc>


    <!-- Background -->

    <rect
        x="8"
        y="8"
        width="240"
        height="240"
        rx="52"
        fill="#6c4ce6"
    />


    <!-- Inner panel -->

    <rect
        x="30"
        y="30"
        width="196"
        height="196"
        rx="40"
        fill="#ffffff"
        opacity="0.98"
    />


    <!-- Graduation cap -->

    <path
        d="
            M52 91
            L128 55
            L204 91
            L128 127
            Z
        "
        fill="#6c4ce6"
    />


    <!-- Cap lower section -->

    <path
        d="
            M77 103
            V132
            C77 151 101 165 128 165
            C155 165 179 151 179 132
            V103
            L128 127
            Z
        "
        fill="#5135c7"
    />


    <!-- Cap button -->

    <circle
        cx="128"
        cy="91"
        r="7"
        fill="#ffffff"
    />


    <!-- Tassel -->

    <path
        d="
            M204 91
            V128
        "
        fill="none"
        stroke="#6c4ce6"
        stroke-width="7"
        stroke-linecap="round"
    />

    <circle
        cx="204"
        cy="135"
        r="7"
        fill="#6c4ce6"
    />


    <!-- BBA text -->

    <text
        x="128"
        y="199"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="27"
        font-weight="800"
        letter-spacing="3"
        fill="#202133"
    >
        BBA
    </text>

</svg>
